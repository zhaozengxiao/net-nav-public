# 推送 main 分支或 v* 标签时自动构建并发布 Docker 镜像到 GHCR
# 镜像地址: ghcr.io/zhaozengxiao/net-nav-public
name: build-and-push-image

# 仅打版本标签时构建一次（避免 push main + push tag 重复构建）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/zhaozengxiao/net-nav-public:latest
            ghcr.io/zhaozengxiao/net-nav-public:${{ steps.meta.outputs.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/zhaozengxiao/net-nav-public:{0}', github.ref_name) || '' }}
