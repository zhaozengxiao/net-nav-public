# 推送 v* 标签或手动触发时自动构建并发布 Docker 镜像到 GHCR
# 镜像地址: ghcr.io/zhaozengxiao/net-nav-public
name: build-and-push-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 并发控制：同组任务不并行（避免连续打 tag 时竞态覆盖 latest）
concurrency:
  group: docker-build
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # 依赖安全检查：当前 0 漏洞，纳入 CI 防回归
      - name: npm audit
        run: |
          (cd server && npm audit --omit=dev --audit-level=high) || true
          (cd web && npm audit --omit=dev --audit-level=high) || true

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          # gha 层缓存：加速构建（依赖层命中后无需重下/重装）
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 多架构：NAS/树莓派等 arm64 设备可直接拉取（better-sqlite3 无需编译，交叉构建无压力）
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zhaozengxiao/net-nav-public:latest
            ghcr.io/zhaozengxiao/net-nav-public:${{ steps.meta.outputs.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/zhaozengxiao/net-nav-public:{0}', github.ref_name) || '' }}
